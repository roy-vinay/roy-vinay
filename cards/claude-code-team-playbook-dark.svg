<svg xmlns="http://www.w3.org/2000/svg" width="480" height="224" viewBox="0 0 480 224" role="img" aria-label="Claude Code Team Playbook: Run several coding agents like a small team. Claim Before Code sends overlapping edits to the owner, not a merge conflict.">
<rect x="0.5" y="0.5" width="479" height="223" rx="14" fill="#161B22" stroke="#30363D"/>
<circle cx="440" cy="44" r="12" fill="none" stroke="#262C36" stroke-width="3.5"/><circle cx="440" cy="44" r="12" fill="none" stroke="#FF8A3D" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="61.8 75.4" transform="rotate(-90 440 44)"/>
<text x="28" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" fill="#E6EDF3">Claude Code Team Playbook</text>
<text x="28" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#C9D1D9">Run several coding agents like a small team.</text><text x="28" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#C9D1D9">Claim Before Code sends overlapping edits to</text><text x="28" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#C9D1D9">the owner, not a merge conflict.</text>
<line x1="28" y1="178" x2="452" y2="178" stroke="#30363D"/>
<text x="28" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FF8A3D">Starter files, specs, and a rework log.</text>
</svg>
